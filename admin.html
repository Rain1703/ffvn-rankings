<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — FFVN Rankings</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><div class="wrap nav"><div class="brand"><span class="brand-mark">FF</span><div><strong>FFVN ADMIN</strong><small>QUẢN TRỊ BẢNG XẾP HẠNG</small></div></div><nav><a href="index.html">← Website</a></nav></div></header>
<main class="admin-page wrap">
  <div id="loginBox" class="admin-card">
    <span class="eyebrow">ADMIN ACCESS</span><h1>Đăng nhập quản trị</h1>
    <p>Bản demo: mật khẩu mặc định <b>ffvn2026</b>. Khi triển khai thật cần thay bằng xác thực máy chủ.</p>
    <input id="password" type="password" placeholder="Mật khẩu">
    <button class="btn primary" onclick="login()">Đăng nhập</button>
    <p id="loginMsg" class="msg"></p>
  </div>
  <div id="dashboard" hidden>
    <div class="admin-head"><div><span class="eyebrow">DASHBOARD</span><h1>Quản lý team</h1></div><button class="btn ghost" onclick="logout()">Đăng xuất</button></div>
    <div class="stats"><div><small>ĐANG XẾP HẠNG</small><strong id="countTeams">0</strong></div><div><small>CHỜ DUYỆT</small><strong id="countPending">0</strong></div></div>
    <section class="admin-card"><h2>Yêu cầu chờ duyệt</h2><div id="pending"></div></section>
    <section class="admin-card"><h2>Top 100 hiện tại</h2><div id="adminRanking"></div></section>
  </div>
</main>
<script src="admin.js"></script>
</body>
</html>
